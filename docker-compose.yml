services:
  postgres:
    image: postgres:latest
    container_name: books_crud_golang_postgres
    env_file:
      - .env
    
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s